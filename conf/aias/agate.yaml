arlas_url_search: $ARLAS_URL_SEARCH|http://arlas-server:9999/arlas/explore/{collection}/_search?f=id:eq:{item}
agate_prefix: $AGATE_PREFIX|/arlas/agate
host: $AGATE_HOST|127.0.0.1
port: $AGATE_PORT|8004
nb_workers: 4
url_header: $AGATE_URL_HEADER|x-forwarded-uri
headers_for_arlas:
  - authorization
  - arlas-org-filter

services:

  airs-storage:
    jwt_location:
    - headers
    jwt_name: authorization
    private:
    - part: path
      pattern: (/airs-storage/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/overview
    - part: path
      pattern: (/airs-storage/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/cog
    public:
    - part: path
      pattern: (/airs-storage/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/thumbnail
  cog:
    jwt_location:
    - headers
    - query_params
    jwt_name: authorization
    private:
    - part: query.url.url.path # takes the query parametters, use it as a url, then extract the path
      pattern: (/airs-storage/)(?P<collection>[^/]+)/items/(?P<item>[^/]+)/assets/(?P<asset>[^/]+)

method_header: $AGATE_METHOD_HEADER|x-forwarded-method
urbac:
  role_file: conf/roles.yaml
  jwt_header: $AGATE_JWT_HEADER|authorization
  jwks_uri: $JWKS_URI  
  verify_jwt: $VERIFY_JWT|true
  verify_ssl: $VERIFY_SSL|true
  jwt_audience: $JWT_AUDIENCE|arlas-backend
