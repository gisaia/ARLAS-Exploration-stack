name: Release Helm Charts

concurrency: release-helm

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'charts/**'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'src'
          ref: 'develop'
          fetch-depth: 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: 'dest'
          ref: 'gh-pages'
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update New Files and push to develop branch
        shell: bash
        working-directory: src
        run: |
          # 1. Update Chart.yaml: Replace local file references (file://) with the official Helm repo URL
          # This ensures the chart is portable and points to hosted dependencies once published.
          sed -i 's|file://\.\./.*|https://gisaia.github.io/ARLAS-Exploration-stack/"|g' k8s/charts/arlas-stack/Chart.yaml
          
          # 2. Initialize a temporary directory for the generated packages (.tgz)
          mkdir -p ./charts/
          
          # 3. Package individual sub-charts into the temporary charts directory
          helm package k8s/charts/aias-services/ --destination charts/
          helm package k8s/charts/arlas-services/ --destination charts/
          helm package k8s/charts/arlas-uis/ --destination charts/
          helm package k8s/charts/titiler/ --destination charts/
          
          # 4. Add external dependencies (e.g., Bitnami) required by the main stack
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

          # 5. Inject the newly created packages into the main stack's charts folder
          # This prepares the environment for the final parent chart build.
          mkdir -p k8s/charts/arlas-stack/charts/
          cp charts/arlas-services-*.tgz k8s/charts/arlas-stack/charts/
          cp charts/aias-services-*.tgz k8s/charts/arlas-stack/charts/
          cp charts/arlas-uis-*.tgz k8s/charts/arlas-stack/charts/
          cp charts/titiler-*.tgz k8s/charts/arlas-stack/charts/

          # 6. Finalize and package the parent chart (Arlas-Stack)
          helm dependency update k8s/charts/arlas-stack/
          helm package k8s/charts/arlas-stack/ --destination charts/
          
          # 7. Update the Helm repository index by merging with the existing index.yaml
          helm repo index ./charts --merge ../dest/index.yaml --url https://raw.githubusercontent.com/gisaia/ARLAS-Exploration-stack/gh-pages/helm
          
          # 8. Revert: Undo the 'sed' modification to keep the source branch clean
          git checkout k8s/charts/arlas-stack/Chart.yaml
          
          # 9. Deployment: Move files to the destination directory for gh-pages
          mkdir -p ../dest/helm
          echo "Copying files..."
          shopt -s extglob
          # Copy all packages except the index.yaml into the /helm subdirectory
          echo "n" | cp -pr ./charts/!(index.yaml) ../dest/helm/
          # Copy the updated index.yaml to the destination root
          echo "n" | cp -pr ./charts/index.yaml ../dest/
          
          # Final cleanup of the temporary charts folder
          echo "y" | rm -rf ./charts/*

      - name: Push New Files
        shell: bash
        working-directory: dest
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # Stage new untracked files only (the .tgz packages) 
          # 'ls-files -o' lists other (untracked) files, excluding those ignored by .gitignore.
          git add $(git ls-files -o --exclude-standard)
          
          git add index.yaml
          git commit -m "Updated from ref: $GITHUB_SHA"
          git push