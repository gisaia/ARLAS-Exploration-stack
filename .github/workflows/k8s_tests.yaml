name: Test Kubernetes ARLAS Exploration stack
on: 
  push:
    paths:
      - 'k8s/**'
      - 'conf/aias/**'

jobs:
  aias-on-k8s-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
      - uses: actions/checkout@v4.1.4

      - name: Add bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Install yq
        run: snap install yq

      - name: Configure dns naming
        run: ./k8s/scripts/configure_for_tests.sh 

      - name: Display conf
        run: head -20 k8s/charts/arlas-stack/values.yaml
        
      - name: deploy arlas
        run: ./k8s/scripts/start.sh 
        
      - name: wait arlas running
        run: ./k8s/scripts/wait_until_running.sh        

      - name: copy files
        run: ./k8s/scripts/copy_files.sh
