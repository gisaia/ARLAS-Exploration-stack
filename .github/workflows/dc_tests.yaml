name: Test Docker compose ARLAS Exploration stack

on: 
  push:
    paths:
      - 'conf/**'
      - 'dc/**'
      - 'scripts/**'
      - 'start.sh'
      - 'stop.sh'
      - '.github/workflows/dc_tests.yaml'
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to test (simple, iam, aias, kc, aiaskc)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - simple
          - iam
          - aias
          - kc
          - aiaskc

jobs:
  simple-stack:
    if: github.event.inputs.stack == 'all' || github.event.inputs.stack == 'simple' || github.event_name == 'pull_request   '
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4.1.4
    - name: Start simple stack
      run: ./start.sh
    - name: Run endpoints tests
      run: ./scripts/test_endpoints.sh
    - name: Install arlas_cli
      run: pip3.10 install arlas_cli
    - name: Init configurations
      run: ./scripts/init_arlas_cli_confs.sh
    - name: Init stack with data
      run: ./scripts/init_stack_with_data.sh local
    - name: Stop stack
      run: ./stop.sh

  iam-stack:
    if: github.event.inputs.stack == 'all' || github.event.inputs.stack == 'iam' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4.1.4
    - name: Start iam stack
      run: ./start.sh iam
    - name: Run endpoints tests
      run: ./scripts/test_endpoints.sh iam
    - name: Install arlas_cli
      run: pip3.10 install arlas_cli
    - name: Install pytest
      run: pip3.10 install pytest==8.3.4
    - name: Launch tests
      run: pytest -s scripts/pytest/test_iam.py
    - name: Stop stack
      run: ./stop.sh

  aias-stack:
    if: github.event.inputs.stack == 'all' || github.event.inputs.stack == 'aias' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4.1.4
    - name: Set hostname
      run: ./scripts/update_hostname.sh
    - name: Start aias stack
      run: ./start.sh aias
    - name: Show logs
      run: scripts/show_logs.sh
    - name: Run endpoints tests
      run: ./scripts/test_endpoints.sh aias
    - name: Stop stack
      run: ./stop.sh

  kc-stack:
    if: github.event.inputs.stack == 'all' || github.event.inputs.stack == 'kc' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4.1.4
    - name: Set hostname
      run: ./scripts/update_hostname.sh
    - name: Start kc stack
      run: ./start.sh kc
    - name: Show logs
      run: scripts/show_logs.sh
    - name: Run endpoints tests
      run: ./scripts/test_endpoints.sh kc
    - name: Stop stack
      run: ./stop.sh

  aiaskc-stack:
    if: github.event.inputs.stack == 'all' || github.event.inputs.stack == 'aiaskc' || github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4.1.4
    - name: Set hostname
      run: ./scripts/update_hostname.sh
    - name: Start aiaskc stack
      run: ./start.sh aiaskc
    - name: Show logs
      run: scripts/show_logs.sh
    - name: Run endpoints tests
      run: ./scripts/test_endpoints.sh aiaskc
    - name: Stop stack
      run: ./stop.sh
