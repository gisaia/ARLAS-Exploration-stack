{{- if eq .Values.uis.wui.aboutAndTourConfigMapName "arlas-default-about-and-tour-configmap" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: arlas-default-about-and-tour-configmap
data:
  about_en.md: |-
    # ARLAS <br>
    __ARLAS Exploration__ is an opensource solution for exploring and analyzing Geo BigData.
    Powered by __Gisaïa__.

    Visit http://arlas.io for more information or contact us at contact@gisaia.com.
    Report any issue to support@gisaia.com.

    Powered by __Gisaïa__
  about_fr.md: |-
    # ARLAS <br>
    __ARLAS Exploration__ est une  solution open-source d'exploration et d'analyse Geo BigData.


    Visitez http://arlas.io pour plus d'informations et contactez nous par mail à l'adresse contact@gisaia.com.
    Vous pouvez rapporter tous problèmes à l'adresse support@gisaia.com.

    Powered by __Gisaïa__
  tour_en.json: |
    {
      "id": "arlastour",
      "steps": [
        {
          "title": "Welcome to ARLAS Exploration, power by Gisaïa",
          "content": "Explore your data instantly through <br><br> - Geo-analytic view on the map (Heatmaps, Grids, ...) <br> - Timeline <br> - Different widgets (histograms, donuts, powernbars) to analyse diffent dimensions of the data.",
          "target": ".top-left-menu .img",
          "placement": "bottom"
        },
        {
          "title": "Global count",
          "content": "It indicates how many elements are explored.",
          "target": ".top-left-menu .chips--container",
          "placement": "bottom"
        },
        {
          "title": "Search box",
          "content": "Here you can search anything to filter the data.",
          "target": "arlas-search",
          "placement": "bottom"
        },
        {
          "title": "Analytics and Filters",
          "content": "This board gives you a global view of your data thanks to the different analytics. <br> You can interact with them directly to filter the data.",
          "target": ".arlas-analytics--container",
          "placement": "right"
        },
        {
          "title": "Timeline filter",
          "content": "This histogram represents the distibution of number of elements over time. You can filter your data by selecting one or several periods: double click on one period to save it, then move the selection brush to define a new interval.",
          "target": ".arlas-timeline",
          "placement": "top",
          "arrowOffset": "center"
        },
        {
          "title": "Time shortcuts",
          "content": "A list of time shortcuts to filter data on a specific time range.",
          "target": ".arlas-time-shortcuts--container",
          "placement": "top",
          "yOffset": -15
        },
        {
          "title": "Maps settings",
          "content": " <strong>ACTION :</strong> Click on the Map settings button",
          "placement": "left",
          "target": ".arlas-map-settings-container",
          "yOffset": -15,
          "showNextButton": false,
          "nextOnTargetClick": true
        },
        {
          "title": "Apply change",
          "content": "<br><br> - Choose how to query geographically the elements (Geo-queries tab). <br><br> <strong>ACTION :</strong> Click to apply changes",
          "target": ".apply-displayed-geometries",
          "placement": "left",
          "yOffset": -10,
          "showNextButton": false,
          "nextOnTargetClick": true
        },
        {
          "title": "Filters and drawing tools",
          "content": "You can draw or remove a bbox/polygon or import it as KML, Geojson or Zipped Shapefile to filter data.",
          "placement": "left",
          "target": ".arlas-map-settings .arlas-map-settings-items:last-child",
          "yOffset": -15
        },
        {
          "title": "Layers legend",
          "content": "Layers are placed in different Visualisation sets that you can hide/display separately. <br><br> You can reorder Visualisation sets and the layers within by dragging and dropping them. <br><br> Each layer has its own legend that you can fold/unfold ",
          "placement": "left",
          "target": ".map__visu-container",
          "yOffset": -15
        }
      ]
    }
  tour_fr.json: |
    {
      "id": "arlastour",
      "steps": [
        {
          "title": "Bienvenue à ARLAS Exploration, power by Gisaïa",
          "content": "Explorer de gros volumes de données géo-spaciales instantanément grâce à <br><br> - Une vue Géo-analytique sur la carte (Heatmaps, Grilles, ...) <br> - Une frise temporelle <br> - Différents widgets (histogrammes, diagrammes en anneau, ...) pour analyser la donnée sur plusieurs axes",
          "target": ".top-left-menu .img",
          "placement": "bottom"
        },
        {
          "title": "Compte global",
          "content": "Indique le nombre d'éléments explorés.",
          "target": ".top-left-menu .chips--container",
          "placement": "bottom"
        },
        {
          "title": "Barre de recherche",
          "content": "Effectuer une recherche Fulltext pour filtrer les données",
          "target": "arlas-search",
          "placement": "bottom"
        },
        {
          "title": "Tableau de board et Filtres",
          "content": "Ce tableau de board vous donne une vue globale de la donnée grâce aux différents analytiques. <br> Vous pouvez intéragir avec ces widgets pour filtrer la donnée.",
          "target": ".arlas-analytics--container",
          "placement": "right"
        },
        {
          "title": "Frise temporelle",
          "content": "Cet histogramme représente la distribution du nombres d'éléments dans le temps. <br> Vous pouvez filtrer la donnée en sélectionnant une ou plusieurs périodes: double-cliquez sur une période pour la sauvegarder, puis resélectionnez un nouvel intervalle.",
          "target": ".arlas-timeline",
          "placement": "top",
          "arrowOffset": "center"
        },
        {
          "title": "Raccourcis temporels",
          "content": "Liste d'un ensemble de raccourcis temporels qui permettent de filtrer la donnée sur une période de temps précise",
          "target": ".arlas-time-shortcuts--container",
          "placement": "top",
          "yOffset": -15
        },
        {
          "title": "Configuration de la carte",
          "content": " <strong>ACTION :</strong> Cliquez sur le bouton 'Configuration de la carte' (icône de Loupe)",
          "placement": "left",
          "target": ".arlas-map-settings-container",
          "yOffset": -15,
          "showNextButton": false,
          "nextOnTargetClick": true
        },
        {
          "title": "Appliquer les changements",
          "content": "<br> - Définir comment rechercher géograhiquement la donnée (onglet Requêtes Géographiques). <br><br>  <strong>ACTION :</strong> Cliquez pour appliquer les changements.",
          "target": ".apply-displayed-geometries",
          "placement": "left",
          "yOffset": -10,
          "showNextButton": false,
          "nextOnTargetClick": true
        },
        {
          "title": "Outils de filtres géographiques",
          "content": "Vous pouvez dessiner un polygone/bbox ou importer un fichier KML, GeoJson ou un Shapefile compressé pour filtrer géographiquement la donnée.",
          "placement": "left",
          "target": ".arlas-map-settings .arlas-map-settings-items:last-child",
          "yOffset": -15
        },
        {
          "title": "Légende des couches cartographiques",
          "content": "les couches cartographiques sont placées dans différents sets de visualisation que vous pouvez afficher/masquer séparément. <br><br> Vous pouvez réordonner les sets de visualisations ainsi que les couches cartographiques par 'drag & drop'. <br><br> Chaque couche cartographique a sa propre légende dépliable.",
          "placement": "left",
          "target": ".map__visu-container",
          "yOffset": -15
        }
      ]
    }
{{- end }}
