apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    {{- include "arlasWebUserInterface.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.uis.wui.serviceName }}
  name: {{ .Values.uis.wui.serviceName }}
spec:
  replicas: {{ int .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "arlasWebUserInterface.labels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.uis.wui.serviceName }}
  template:
    metadata:
      labels:
        {{- include "arlasWebUserInterface.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.uis.wui.serviceName }}
    spec:
      automountServiceAccountToken: false

      {{- if .Values.uis.wui.basemapUrl }}
      initContainers:
        - name: download-file
          image: curlimages/curl:latest
          command: ["sh", "-c"]
          args:
            - '[ ! -f "/usr/share/nginx/html/assets/basemap/world.pmtiles" ] && (echo "Downloading basemap from ${BASEMAP_URL} ..." && curl -L -o /usr/share/nginx/html/assets/basemap/world.pmtiles  ${BASEMAP_URL} && ls -hl /usr/share/nginx/html/assets/basemap/world.pmtiles ) || echo "Basemap already exists, skipping download."'
          env:
            - name: BASEMAP_URL
              value: {{ .Values.uis.wui.basemapUrl | quote }}
          volumeMounts:
            - mountPath: "/usr/share/nginx/html/assets/basemap"
              name: basemap-volume
      {{- end }}

      containers:
        - name: {{ .Values.uis.wui.serviceName }}
          image: {{ .Values.uis.wui.image }}
          ports:
            - name: http
              containerPort: {{ .Values.uis.servicePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.uis.wui.urlPrefix }}
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.uis.wui.urlPrefix }}
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- if .Values.uis.wui.extraEnvVars }}
            {{ .Values.uis.wui.extraEnvVars | toYaml | nindent 12 }}
            {{- end }}

            - name: ARLAS_AUTHENT_FORCE_CONNECT
              value: {{ .Values.authent.forceConnect | quote  }}
            - name: ARLAS_AUTHENT_REDIRECT_URI
              value: {{ .Values.protocol }}://{{ .Values.dnsDomain }}{{ .Values.uis.hub.urlPrefix }}/callback
            - name: ARLAS_AUTHENT_SILENT_REFRESH_REDIRECT_URI
              value: {{ .Values.protocol }}://{{ .Values.dnsDomain }}{{ .Values.uis.hub.urlPrefix }}/silent-refresh.html

            {{- include "arlasWebUserInterface.auth2Env" . | nindent 12 }}

            {{- include "arlasWebUserInterface.linksEnv" . | nindent 12 }}

            {{- include "arlasWebUserInterface.servicesEnv" . | nindent 12 }}

            {{- include "arlasWebUserInterface.actionsEnv" . | nindent 12 }}

            # ENDPOINT CONFIGURATION
            - name: ARLAS_WUI_BASE_HREF
              value: {{ .Values.uis.wui.urlPrefix }}

            # USER INTERFACE CONFIGURATION
            - name: ARLAS_STATIC_LINKS
              value: {{ .Values.links | quote }}
            - name: ARLAS_TAB_NAME
              value: {{ .Values.uis.wui.tabName | quote }}
            - name: ARLAS_GEOCODING_ENABLED
              value: {{ .Values.enableGeocoding | quote }}
            - name: ARLAS_GEOCODING_FIND_PLACE_ZOOM_TO
              value: {{ .Values.geocodingZoomTo | quote }}
            - name: RESULTLIST_ENABLE_EXPORT
              value: {{ .Values.resultListEnableExport | quote }}
            - name: RESULTLIST_EXPORT_SIZE
              value: {{ .Values.resultListExportSize | quote }}
            - name: ARLAS_HISTOGRAMS_MAX_BUCKETS
              value: {{ .Values.histogramsMaxBucket | quote }}
            - name: ARLAS_EXPORT_HISTOGRAMS_NB_BUCKETS
              value: {{ .Values.histogramsExportNbBuckets | quote }}

          {{- range $configurationName, $configurationInfo := .Values.configuration }}
            - name: {{ (index $.Values.configuration $configurationName).environmentVariable }}
              value: file://{{ (index $.Values.configuration $configurationName).mountPath }}
          {{- end }}
          volumeMounts:
            {{- if .Values.uis.wui.basemapUrl }}
            - mountPath: "/usr/share/nginx/html/assets/basemap"
              name: basemap-volume
            {{- end }}            
            - mountPath: "/usr/share/nginx/html/assets/styles/custom-style.css"
              name: custom-style-volume
              subPath: custom-style.css
            {{- if .Values.uis.logoImagePng60x60Base64 }}
            - name: logo-volume
              mountPath: /usr/share/nginx/html/assets/logo-only.png
              subPath: logo-only.png
            {{- end }}
            {{- if .Values.uis.spinnerGifBase64 }}
            - name: logo-volume
              mountPath: /usr/share/nginx/html/assets/spinner.gif
              subPath: spinner.gif
            {{- end }}
            {{- if .Values.uis.noViewPngBase64 }}
            - name: logo-volume
              mountPath: /usr/share/nginx/html/assets/no-view.png
              subPath: no-view.png
            {{- end }}
            {{- if .Values.uis.logoInnerPngBase64 }}
            - name: logo-volume
              mountPath: /usr/share/nginx/html/assets/arlas-logo-inner-white-24.png
              subPath: arlas-logo-inner-white-24.png
            {{- end }}
          
      volumes:
        {{- if .Values.uis.wui.basemapUrl }}
        - name: basemap-volume
          persistentVolumeClaim:
            claimName: basemap-pvc
        {{- end }}
        - name: custom-style-volume
          configMap:
            name: arlas-custom-style
        - name: logo-volume
          configMap:
            name: arlas-logo-configmap

      # NODE SELECTION      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
