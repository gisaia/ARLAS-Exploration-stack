apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.services.aproc.worker.serviceName }}
  name: {{ .Values.services.aproc.worker.serviceName }}
spec:
  replicas: {{ int .Values.services.aproc.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.services.aproc.worker.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.services.aproc.worker.serviceName }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.services.podSecurityContext | nindent 8 }}
      {{- with .Values.services.aproc.worker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.services.aproc.worker.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Values.services.aproc.worker.serviceName }}
          image: {{ .Values.services.aproc.worker.image }}
          securityContext:
            {{- toYaml .Values.services.containerSecurityContext | nindent 12 }}
          livenessProbe:
            exec:
              command:
              - /app/ping.sh
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
              - /app/ping.sh
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            {{- toYaml .Values.services.aproc.worker.resources | nindent 12 }}
          env:
            - name: APROC_CONFIGURATION_FILE
              value: /app/conf/aproc.yaml

            - name: BROKER
              value: {{ .Values.services.aproc.configuration.celeryBrokerUrl }}
            - name: QUEUE_NAMES
              value: small_task_queue,medium_task_queue,large_task_queue,aproc_default_queue

            # LOGGING
            - name: APROC_LOGGER_LEVEL
              value: {{ .Values.logger.loggingLevel }}
            - name: ACCESS_LOGGER_LEVEL
              value: {{ .Values.logger.loggingLevel }}

            {{- with .Values.services.aproc.worker.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: aproc-files
              mountPath: /app/conf/
              readOnly: true
            - name: arlas-eo-mappings
              mountPath: /app/mappings/
              readOnly: true
          {{- with .Values.services.aproc.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.services.aproc.worker.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: aproc-files
          configMap:
            name: aproc-files-configmap
        - name: arlas-eo-mappings
          configMap:
            name: arlas-eo-mappings-configmap
        {{- with .Values.services.aproc.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # NODE SELECTION      
      {{- with .Values.services.aproc.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.aproc.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.aproc.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
