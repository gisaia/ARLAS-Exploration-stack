apiVersion: v1
data:
  aproc.yaml: |
    celery_broker_url: $CELERY_BROKER_URL|pyamqp://guest:guest@127.0.0.1:5672//
    celery_result_backend: $CELERY_RESULT_BACKEND|redis://127.0.0.1:6379/0
    airs_endpoint: $AIRS_ENDPOINT|http://127.0.0.1:8000/arlas/airs
    processes:
      -
        name: ingest
        class_name: extensions.aproc.proc.ingest.ingest_process
        configuration:
          drivers: conf/drivers.yaml
      -
        name: directory_ingest
        class_name: extensions.aproc.proc.ingest.directory_ingest_process
        configuration:
          drivers: conf/drivers.yaml
      -
        name: download
        class_name: extensions.aproc.proc.download.download_process
        configuration:
          drivers: conf/download_drivers.yaml
      -
        name: enrich
        class_name: extensions.aproc.proc.enrich.enrich_process
        configuration:
          drivers: conf/enrich_drivers.yaml
      -
        name: dc3build
        class_name: extensions.aproc.proc.dc3build.dc3build_process
        configuration:
          drivers: conf/dc3build_drivers.yaml


    access_manager:
      tmp_dir: /tmp/
      storages:
        -
          type: file
          writable_paths:
            - /tmp
            - /outbox
          readable_paths:
            - /inputs
        -
          type: gs
          bucket: gisaia-public
          # api_key:
          #   project_id: $APROC_INPUT_STORAGE_API_KEY_PROJECT
          #   private_key_id: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY_ID
          #   private_key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
        -
          type: s3
          bucket: archives
          endpoint: "http://minio:9000"
        # -
        #   type: https
        #   headers: $APROC_INPUT_STORAGE_HEADERS
        #   domain: $APROC_INPUT_STORAGE_DOMAIN
        #   force_download: $APROC_INPUT_STORAGE_FORCE_DOWNLOAD

        -
          type: s3
          bucket: gisaia-public
          endpoint: "https://storage.googleapis.com"
  dc3build_drivers.yaml: |
    arlas_url_search: $ARLAS_URL_SEARCH
    drivers:
      -
        name: safe
        class_name: extensions.aproc.proc.dc3build.drivers.impl.safe
        assets_dir: /tmp/aproc/safe
        configuration:
        priority: 1
  download_drivers.yaml: |
    arlas_url_search: $ARLAS_URL_SEARCH
    arlaseo_mapping_url: $ARLASEO_MAPPING_URL|"https://raw.githubusercontent.com/gisaia/ARLAS-EO/v0.0.9/mapping.json"
    download_mapping_url: $DOWNLOAD_MAPPING_URL|"https://raw.githubusercontent.com/gisaia/ARLAS-EO/v0.0.9/downloads_mapping.json"

    clean_outbox_directory: $CLEAN_DOWNLOAD_OUTBOX_DIR|True
    outbox_directory: $APROC_DOWNLOAD_OUTBOX_DIR
    outbox_s3:
      bucket: $DOWNLOAD_S3_BUCKET
      access_key_id: $DOWNLOAD_S3_ACCESS_KEY_ID
      secret_access_key: $DOWNLOAD_S3_SECRET_ACCESS_KEY
      asset_http_endpoint_url: $DOWNLOAD_S3_ASSET_HTTP_ENDPOINT_URL
      endpoint_url: $DOWNLOAD_S3_ENDPOINT_URL

    notification_admin_emails: $APROC_DOWNLOAD_ADMIN_EMAILS
    # Usable variables in messages: {target_projection}, {target_format}, {arlas-user-email}, {item_id}, {asset_name}, {collection}, {target_directory}, {file_name}
    # Usable variables in messages: {error}

    email_subject_user: $APROC_DOWNLOAD_SUBJECT_USER
    email_content_user: $APROC_DOWNLOAD_CONTENT_USER
    email_subject_error_download: $APROC_DOWNLOAD_SUBJECT_ERROR
    email_content_error_download: $APROC_DOWNLOAD_CONTENT_ERROR
    email_subject_admin: $APROC_DOWNLOAD_SUBJECT_ADMIN
    email_content_admin: $APROC_DOWNLOAD_CONTENT_ADMIN

    email_request_subject_user: $APROC_DOWNLOAD_REQUEST_SUBJECT_USER
    email_request_content_user: $APROC_DOWNLOAD_REQUEST_CONTENT_USER
    email_request_subject_admin: $APROC_DOWNLOAD_REQUEST_SUBJECT_ADMIN
    email_request_content_admin: $APROC_DOWNLOAD_REQUEST_CONTENT_ADMIN

    email_path_prefix_add: $APROC_EMAIL_PATH_PREFIX_ADD
    email_path_to_windows: $APROC_PATH_TO_WINDOWS

    smtp:
      host: $ARLAS_SMTP_HOST
      port: $ARLAS_SMTP_PORT
      login: $ARLAS_SMTP_USERNAME
      password: $ARLAS_SMTP_PASSWORD
      from_addr: $ARLAS_SMTP_FROM

    index_for_download:
      endpoint_url: $APROC_INDEX_ENDPOINT_URL|https://localhost:9200
      index_name: $APROC_INDEX_NAME|aproc_downloads
      login: $APROC_INDEX_LOGIN
      pwd: $APROC_INDEX_PWD

    drivers:
      -
        name: simple_copy
        class_name: extensions.aproc.proc.download.drivers.impl.simple_copy
        configuration:
        assets_dir: /tmp/aproc/download
        priority: 4
      -
        name: met_file
        class_name: extensions.aproc.proc.download.drivers.impl.met_file
        configuration:
        assets_dir: /tmp/aproc/download
        priority: 2
      -
        name: image_file
        class_name: extensions.aproc.proc.download.drivers.impl.image_file
        configuration:
        assets_dir: /tmp/aproc/download
        priority: 3
      -
        name: zarr
        class_name: extensions.aproc.proc.download.drivers.impl.zarr
        assets_dir: /tmp/aproc/download
        configuration:
          chunk_size: 1000
          # input:
          #   type: $APROC_INPUT_STORAGE_TYPE
          #   bucket: $APROC_INPUT_STORAGE_BUCKET
          #   api_key:
          #     project_id: $APROC_INPUT_STORAGE_API_KEY_PROJECT
          #     private_key_id: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY_ID
          #     private_key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
          #   headers:
          #     X-API-Key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
          #     Accept: "application/json, text/plain"
          #     Connection: "keep-alive"
          #     Sec-Fetch-Dest: "empty"
          #     Content-Type: application/json;charset=utf-8
          #   domain: $APROC_INPUT_STORAGE_DOMAIN
          #   force_download: $APROC_INPUT_STORAGE_FORCE_DOWNLOAD
        priority: 1
  drivers.yaml: |
    inputs_directory: $INGESTED_FOLDER|/inputs

    max_number_of_archive_for_ingest: 1000000
    aproc_endpoint: $APROC_ENDPOINT_FROM_APROC|http://localhost:8001
    resource_id_hash_starts_at: $APROC_RESOURCE_ID_HASH_STARTS_AT|1

    drivers:
      -
        name: dimap
        class_name: extensions.aproc.proc.ingest.drivers.impl.dimap
        assets_dir: /tmp/aproc/dimap
        configuration:
        priority: 1
      -
        name: geoeye
        class_name: extensions.aproc.proc.ingest.drivers.impl.geoeye
        assets_dir: /tmp/aproc/geoeye
        configuration:
        priority: 2
      -
        name: digitalglobe
        class_name: extensions.aproc.proc.ingest.drivers.impl.digitalglobe
        assets_dir: /tmp/aproc/digitalglobe
        configuration:
        priority: 3
      -
        name: ast_dem
        class_name: extensions.aproc.proc.ingest.drivers.impl.ast_dem
        assets_dir: /tmp/aproc/ast_dem
        configuration:
        priority: 4
      -
        name: rapideye
        class_name: extensions.aproc.proc.ingest.drivers.impl.rapideye
        assets_dir: /tmp/aproc/rapideye
        configuration:
        priority: 5
      -
        name: spot5
        class_name: extensions.aproc.proc.ingest.drivers.impl.spot5
        assets_dir: /tmp/aproc/spot5
        configuration:
        priority: 6
      -
        name: terrasarx
        class_name: extensions.aproc.proc.ingest.drivers.impl.terrasarx
        assets_dir: /tmp/aproc/terrasarx
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 7
      -
        name: cosmoskymed
        class_name: extensions.aproc.proc.ingest.drivers.impl.cosmoskymed
        assets_dir: /tmp/aproc/cosmoskymed
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 8
      -
        name: umbra
        class_name: extensions.aproc.proc.ingest.drivers.impl.umbra
        assets_dir: /tmp/aproc/umbra
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 9
      -
        name: bsg
        class_name: extensions.aproc.proc.ingest.drivers.impl.bsg
        assets_dir: /tmp/aproc/bsg
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 10

      -
        name: tiff
        class_name: extensions.aproc.proc.ingest.drivers.impl.tiff
        assets_dir: /tmp/aproc/tiff
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 11

      -
        name: jpeg2000
        class_name: extensions.aproc.proc.ingest.drivers.impl.jpeg2000
        assets_dir: /tmp/aproc/jpeg2000
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 12

      -
        name: sentinel2
        class_name: extensions.aproc.proc.ingest.drivers.impl.sentinel_2
        assets_dir: /tmp/aproc/sentinel2
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 13
  enrich_drivers.yaml: |
    drivers:
      -
        name: safe
        class_name: extensions.aproc.proc.enrich.drivers.impl.safe
        assets_dir: /tmp/aproc/safe
        configuration:
          input:
            type: $APROC_INPUT_STORAGE_TYPE
            bucket: $APROC_INPUT_STORAGE_BUCKET
            api_key:
              project_id: $APROC_INPUT_STORAGE_API_KEY_PROJECT
              private_key_id: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY_ID
              private_key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
            headers:
              X-API-Key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
              Accept: "application/json, text/plain"
              Connection: "keep-alive"
              Sec-Fetch-Dest: "empty"
              Content-Type: application/json;charset=utf-8
            domain: $APROC_INPUT_STORAGE_DOMAIN
            force_download: $APROC_INPUT_STORAGE_FORCE_DOWNLOAD
        priority: 1
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: aproc-files-configmap
