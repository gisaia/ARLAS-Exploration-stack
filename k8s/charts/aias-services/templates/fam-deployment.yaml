apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.services.fam.serviceName }}
  name: {{ .Values.services.fam.serviceName }}
spec:
  replicas: {{ int .Values.services.fam.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.services.fam.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.services.fam.serviceName }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.services.podSecurityContext | nindent 8 }}

      {{- with .Values.services.fam.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.services.fam.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Values.services.fam.serviceName }}
          image: {{ .Values.services.fam.image }}
          securityContext:
            {{- toYaml .Values.services.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.services.servicePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.services.fam.urlPrefix }}/healthcheck
              port: {{ .Values.services.servicePort }}
            initialDelaySeconds: 40
          readinessProbe:
            httpGet:
              path: {{ .Values.services.fam.urlPrefix }}/healthcheck
              port: {{ .Values.services.servicePort }}
            initialDelaySeconds: 40
          resources:
            {{- toYaml .Values.services.fam.resources | nindent 12 }}
          env:
            - name: APROC_CONFIGURATION_FILE
              value: /app/conf/aproc.yaml

            # ENDPOINT CONFIGURATION              
            - name: FAM_CORS_HEADERS
              value: {{ .Values.cors.allowedHeaders | quote }}
            - name: FAM_CORS_METHODS
              value: {{ .Values.cors.allowedMethods | quote }}
            - name: FAM_CORS_ORIGINS
              value: {{ .Values.cors.allowedOrigins | squote }}
            - name: FAM_HOST
              value: {{ .Values.cors.allowedHosts | squote }}

            - name: FAM_PORT
              value: {{ .Values.services.servicePort | squote }}
            - name: FAM_PREFIX
              value: {{ .Values.services.fam.urlPrefix }}

            # LOGGING
            - name: FAM_LOGGER_LEVEL
              value: {{ .Values.logger.loggingLevel }}
            - name: ACCESS_LOGGER_LEVEL
              value: {{ .Values.logger.loggingLevel }}

            {{- with .Values.services.fam.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}

          volumeMounts:
            - name: fam-files
              mountPath: /app/conf/
              readOnly: true
          {{- with .Values.services.fam.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.services.fam.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: fam-files
          configMap:
            name: aproc-files-configmap
        {{- with .Values.services.fam.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # NODE SELECTION      
      {{- with .Values.services.fam.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.fam.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.services.fam.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
