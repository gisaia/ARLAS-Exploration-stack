apiVersion: v1
data:
  aproc.yaml: |
    celery_broker_url: $CELERY_BROKER_URL|pyamqp://guest:guest@127.0.0.1:5672//
    celery_result_backend: $CELERY_RESULT_BACKEND|redis://127.0.0.1:6379/0
    airs_endpoint: $AIRS_ENDPOINT|http://127.0.0.1:8000/arlas/airs
    processes:
      -
        name: ingest
        class_name: extensions.aproc.proc.ingest.ingest_process
        configuration:
          drivers: conf/drivers.yaml
      -
        name: directory_ingest
        class_name: extensions.aproc.proc.ingest.directory_ingest_process
        configuration:
          drivers: conf/drivers.yaml
      -
        name: download
        class_name: extensions.aproc.proc.download.download_process
        configuration:
          drivers: conf/download_drivers.yaml
      -
        name: enrich
        class_name: extensions.aproc.proc.enrich.enrich_process
        configuration:
          drivers: conf/enrich_drivers.yaml
      -
        name: dc3build
        class_name: extensions.aproc.proc.dc3build.dc3build_process
        configuration:
          drivers: conf/dc3build_drivers.yaml


    access_manager:
      tmp_dir: /tmp/
      storages:
        -
          type: file
          writable_paths:
            - /tmp
            - /outbox
          readable_paths:
            - /inputs
        -
          type: gs
          bucket: gisaia-public
          # api_key:
          #   project_id: $APROC_INPUT_STORAGE_API_KEY_PROJECT
          #   private_key_id: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY_ID
          #   private_key: $APROC_INPUT_STORAGE_API_KEY_PRIVATE_KEY
        -
          type: s3
          bucket: archives
          endpoint: "http://minio:9000"
        # -
        #   type: https
        #   headers: $APROC_INPUT_STORAGE_HEADERS
        #   domain: $APROC_INPUT_STORAGE_DOMAIN
        #   force_download: $APROC_INPUT_STORAGE_FORCE_DOWNLOAD

        -
          type: s3
          bucket: gisaia-public
          endpoint: "https://storage.googleapis.com"
  drivers.yaml: |
    inputs_directory: $INGESTED_FOLDER|/inputs

    max_number_of_archive_for_ingest: 1000000
    aproc_endpoint: $APROC_ENDPOINT_FROM_APROC|http://localhost:8001
    resource_id_hash_starts_at: $APROC_RESOURCE_ID_HASH_STARTS_AT|1

    drivers:
      -
        name: dimap
        class_name: extensions.aproc.proc.ingest.drivers.impl.dimap
        assets_dir: /tmp/aproc/dimap
        configuration:
        priority: 1
      -
        name: geoeye
        class_name: extensions.aproc.proc.ingest.drivers.impl.geoeye
        assets_dir: /tmp/aproc/geoeye
        configuration:
        priority: 2
      -
        name: digitalglobe
        class_name: extensions.aproc.proc.ingest.drivers.impl.digitalglobe
        assets_dir: /tmp/aproc/digitalglobe
        configuration:
        priority: 3
      -
        name: ast_dem
        class_name: extensions.aproc.proc.ingest.drivers.impl.ast_dem
        assets_dir: /tmp/aproc/ast_dem
        configuration:
        priority: 4
      -
        name: rapideye
        class_name: extensions.aproc.proc.ingest.drivers.impl.rapideye
        assets_dir: /tmp/aproc/rapideye
        configuration:
        priority: 5
      -
        name: spot5
        class_name: extensions.aproc.proc.ingest.drivers.impl.spot5
        assets_dir: /tmp/aproc/spot5
        configuration:
        priority: 6
      -
        name: terrasarx
        class_name: extensions.aproc.proc.ingest.drivers.impl.terrasarx
        assets_dir: /tmp/aproc/terrasarx
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 7
      -
        name: cosmoskymed
        class_name: extensions.aproc.proc.ingest.drivers.impl.cosmoskymed
        assets_dir: /tmp/aproc/cosmoskymed
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 8
      -
        name: umbra
        class_name: extensions.aproc.proc.ingest.drivers.impl.umbra
        assets_dir: /tmp/aproc/umbra
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 9
      -
        name: bsg
        class_name: extensions.aproc.proc.ingest.drivers.impl.bsg
        assets_dir: /tmp/aproc/bsg
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 10

      -
        name: tiff
        class_name: extensions.aproc.proc.ingest.drivers.impl.tiff
        assets_dir: /tmp/aproc/tiff
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 11

      -
        name: jpeg2000
        class_name: extensions.aproc.proc.ingest.drivers.impl.jpeg2000
        assets_dir: /tmp/aproc/jpeg2000
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 12

      -
        name: sentinel2
        class_name: extensions.aproc.proc.ingest.drivers.impl.sentinel_2
        assets_dir: /tmp/aproc/sentinel2
        configuration:
          tmp_directory: $TMP_FOLDER|/tmp
        priority: 13
  fam.yaml: |
    inputs_directory: $INGESTED_FOLDER|/inputs
    driver_configuration_file: conf/drivers.yaml
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: fam-files-configmap
