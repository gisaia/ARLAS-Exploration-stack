apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.serviceName }}
  name: {{ .Values.serviceName }}
spec:
  replicas: {{ int .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.serviceName }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.serviceName }}
          image: {{ .Values.image }}
          livenessProbe:
            httpGet:
              path: {{ .Values.urlPrefix }}/healthcheck
              port: {{ .Values.servicePort }}
            initialDelaySeconds: 40
          readinessProbe:
            httpGet:
              path: {{ .Values.urlPrefix }}/healthcheck
              port: {{ .Values.servicePort }}
            initialDelaySeconds: 40
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # APM CONFIGURATION
            {{- if .Values.apm }}
            - name: ELASTIC_APM_LOG_ECS_REFORMATTING
              value: "OVERRIDE"
            - name: ELASTIC_APM_LOG_ECS_FORMATTER_ALLOW_LIST
              value: "*"
            - name: ELASTIC_APM_SERVICE_NAME
              value:  {{ .Values.serviceName }}
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: "io.arlas"
            - name: ELASTIC_APM_USE_JAXRS_PATH_AS_TRANSACTION_NAME
              value: '"true"'
            - name: ELASTIC_APM_SECRET_TOKEN
              value: {{ .Values.elastic.apm.secret }}
            - name: ELASTIC_APM_SERVER_URLS
              value: {{ .Values.elastic.apm.url }}
            - name: ELASTIC_APM_ENVIRONMENT
              value: {{ .Release.Name }}
            - name: ELASTIC_APM_TRANSACTION_IGNORE_USER_AGENTS
              value: "GoogleHC/*, kube-probe/*, curl*, GoogleStackdriverMonitoring*"
            {{- end }}

            - name: AIRS_COLLECTION_URL
              value: https://raw.githubusercontent.com/gisaia/ARLAS-EO/v0.0.6/collection.json

            # ENDPOINT CONFIGURATION              
            - name: AIRS_CORS_HEADERS
              value: {{ .Values.cors.allowedHeaders | quote }}
            - name: AIRS_CORS_METHODS
              value: {{ .Values.cors.allowedMethods | quote }}
            - name: AIRS_CORS_ORIGINS
              value: {{ .Values.cors.allowedOrigins | squote }}
            - name: AIRS_HOST
              value: {{ .Values.cors.allowedHosts | squote }}

            - name: AIRS_PORT
              value: "8000"
            - name: AIRS_PREFIX
              value: {{ .Values.urlPrefix }}

            # INDEX CONFIGURATION
            - name: AIRS_INDEX_COLLECTION_PREFIX
              value: "{{ .Values.organization }}@{{ .Values.airsIndexPrefix }}"

            # INDEX MAPPING
            - name: ARLASEO_MAPPING_URL
              value: {{ .Values.arlasMappingUrl | quote }}

            # ELASTICSEARCH CONFIGURATION
            - name: AIRS_INDEX_ENDPOINT_URL
              value: "https://{{ .Release.Name }}-elasticsearch:9200" # TO BE IMPROVED: remove the protocol
            - name: ARLAS_ELASTIC_CLUSTER
              value: {{ .Values.elastic.cluster }}
            - name: ARLAS_ELASTIC_NODES
              value: {{ .Release.Name }}-elasticsearch:9200
            - name: AIRS_INDEX_LOGIN
              value: {{ .Values.elastic.login }}
            - name: AIRS_INDEX_PWD
              value: {{ .Values.elastic.password }}
            {{- with .Values.elasticEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}

            # LOGGING
            - name: AIRS_LOGGER_LEVEL
              value: {{ .Values.logger.loggingLevel }}

            # OBJECT STORAGE
            - name: AIRS_S3_ACCESS_KEY_ID
              value: {{ .Values.s3.accessKeyId | quote }}
            - name: AIRS_S3_SECRET_ACCESS_KEY
              value: {{ .Values.s3.secret | quote }}
            - name: AIRS_S3_ASSET_HTTP_ENDPOINT_URL
              value: {{ .Values.s3.assetHttpEndpointUrlPattern | quote }}
            - name: AIRS_S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: AIRS_S3_ENDPOINT_URL
              value: {{ .Values.s3.endpoint | quote }}
            - name: AIRS_S3_PLATFORM
              value: {{ .Values.s3.platform | quote }}
            - name: AIRS_S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: AIRS_S3_TIER
              value: {{ .Values.s3.tier | quote }}

      # NODE SELECTION      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
