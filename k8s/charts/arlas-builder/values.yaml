## @section Global parameters

# -- DNS domain hosting ARLAS
dnsDomain: localhost

serviceName: arlas-builder
servicePort: 8080
serviceType: ClusterIP
image: gisaia/arlas-wui-builder:27.0.4


persistence:
  urlPrefix: /arlas/persistence

permissions:
  urlPrefix: /arlas/permissions

builderUrl: /builder/
hubUrl: /hub/
wuiURL: /wui/

authent:
  # -- When authentication is enabled, this option forces to be connected to Identity Provider at application bootstrap
  forceConnect: false
  # -- Defines whether to be authenticated to Identity Provider
  useAuthent: true
  # -- Defines authentication mode (i.e. "iam", "openid" or not defined)
  authMode: openid
  # -- Refresh token timer (arlas iam)
  threshold: 60000
  # -- Defines whether we use Identity Provider document discovery service
  useDiscovery: true
  #-- The requested scopes
  scope: profile
  # -- Custom query params
  customQueryParams:
    - audience: http://arlas.io/api/server
  # -- Defines whether https is required
  requireHttps: true
  # -- Response type values
  responseType: code
  # -- Timeout for silent refresh
  silentRefreshTimeout: "10000"
  # -- Defines when the token_timeout event should be raised. If you set this to the default value 0.75, the event s triggered after 75% of the token's life time.
  timeoutFactor: "0.75"
  # -- If true, the app will try to check whether the user is still logged in on a regular basis as described
  sessionChecksEnabled: true
  # -- Defines whether to clear the hash fragment in url after logging in
  clearHashAfterLogin: true
  # -- This property has been introduced to disable at_hash checks and is indented for Identity Provider that does not deliver an at_hash EVEN THOUGH its recommended by the OIDC specs.
  disableAtHashCheck: true
  # -- Defines whether to display debug log in browser console
  showDebugInformation: false
  # -- Defines the kind of storage: localstorage or sessionstorage
  storage: memorystorage
  # -- The issuer's uri
  issuer: 
  # -- The logout URL to be used
  logoutUrl:
  # -- The client's id as registered with the auth server
  clientId:

allowExternalNodeConfiguration: true
basemaps: [{"name":"Streets-light","url":"https://api.maptiler.com/maps/208a41eb-368f-4003-8e3c-2dba0d90b3cb/style.json?key=xIhbu1RwgdbxfZNmoXn4","image":"https://api.maptiler.com/maps/208a41eb-368f-4003-8e3c-2dba0d90b3cb/0/0/0.png?key=xIhbu1RwgdbxfZNmoXn4"}]


configuration: {}

# -- Number of desired pods
replicaCount: 1

resources:
  requests:
    cpu: 0.05
    memory: 10Mi
  limits:
    cpu: 0.3
    memory: 30Mi

logger:
  # -- Default logging level
  loggingLevel: INFO
  # -- Default console logging level
  loggingConsoleLevel: INFO


# -- Label-based selector, to control the nodes the pod(s) will run on. See https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#nodeselector
nodeSelector: {}
# -- Pod-Tolerations & Nodes-Taints work together to allow nodes to repel certain kinds of pods. See https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []
# -- Allows constraining pod(s) to only run on particular nodes, or to prefer to run on particular nodes. It is based on label-selection. See https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

