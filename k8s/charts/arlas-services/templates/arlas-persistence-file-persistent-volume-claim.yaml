apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arlas-persistence-file-pvc
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.storageSize }}
  storageClassName: {{ .Values.defaultStorageClass }}