apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: {{ .Values.service.serviceName }}
  name: {{ .Values.service.serviceName }}
spec:
  type: {{ .Values.service.serviceType }}
  ports:
    - name: "http"
      port: {{ .Values.service.servicePort }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/component: {{ .Values.service.serviceName }}
