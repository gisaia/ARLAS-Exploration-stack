global: 
  # -- __MUST BE CONFIGURED:__ The domain name for accessing the ARLAS deployment
  dnsDomain: &arlasAppDnsDomain site.arlas.k8s

  # -- __MUST BE CONFIGURED:__ The domain name for accessing ES for ARLAS deployment
  elasticDnsDomain: &arlasAppElasticDnsDomain elastic.arlas.k8s

  # -- __MUST BE CONFIGURED:__ The domain name for accessing kibana for ARLAS deployment
  kibanaDnsDomain: &arlasAppKibanaDnsDomain kibana.arlas.k8s
  enableKibana: &arlasAppEnableKibana true

  # -- __MUST BE CONFIGURED:__ The domain name for accessing minio for ARLAS deployment
  minioDnsDomain: &arlasAppMinioDnsDomain minio.arlas.k8s

  # -- __MUST BE CONFIGURED:__ The domain name for accessing keycloak for ARLAS deployment
  keycloakDnsDomain: &arlasAppKeycloakDnsDomain keycloak.arlas.k8s

  # -- __MUST BE CONFIGURED:__ The protocol for accessing the ARLAS deployment
  protocol: &arlasAppProtocol https

  # -- __MUST BE CONFIGURED:__ The default ingress class. By default, the `nginx` controler is used.
  ingressClassName: &arlasAppIngressClassName nginx

  # -- __MUST BE CONFIGURED:__ The default ARLAS storage class for the persistence. By default, the `standard-retain` storage class is created based on the provisioner `rancher.io/local-path` with a retain policy.
  defaultStorageClass: &arlasAppDefaultStorageClass standard-retain

  keycloak:
    # -- __MUST BE CONFIGURED:__ The secret configured for the ARLAS client of the keyckloak's realm 
    secret: &arlasAppKeycloakSecret rha14c4202RB0Dxlke6ZNCCTw9gkvLJ8
    # -- __MUST BE CONFIGURED:__ Keycloak URL
    url: &arlasAppKeycloakUrl https://keycloak.arlas.k8s

  # -- __MUST BE CONFIGURED:__ The issuer's uri
  authIssuer: &arlasAppAuthIssuer https://keycloak.arlas.k8s/realms/arlas 
  # -- The logout URL to be used
  logoutUrl: &arlasAppLogoutUrl 

  # -- __MUST BE CONFIGURED:__ Name of the organization using AIAS
  organization: &arlasAppOrganization org.com

  # -- Elasticsearch login for elasticsearch itself and the services that are connecting to elasticsearch
  elasticLogin: &arlasAppElasticLogin arlas-user
  # -- __MUST BE CONFIGURED:__ Elasticsearch password for elasticsearch itself and the services that are connecting to elasticsearch
  elasticPassword: &arlasAppElasticPassword secret4elastic

  # -- Minio login for minio itself and the services that are connecting to minio
  minioLogin: &arlasAppMinioLogin minioadmin
  # -- __MUST BE CONFIGURED:__ Minio password for minio itself and the services that are connecting to minio
  minioPassword: &arlasAppMinioPassword secret4minio

  # -- Keycloak admin login for keycloak deployment (for test only)
  keycloakLogin: &arlasAppKeycloakLogin admin
  # -- __MUST BE CONFIGURED:__ Keycloak admin password 
  keycloakPassword: &arlasAppKeycloakPassword secret4keycloak

  # -- RabbitMQ Login
  rabbitMQLogin: &arlasAppRabbitMQLogin admin
  # -- __MUST BE CONFIGURED:__ RabbitMQ Password
  rabbitMQPassword: &arlasAppRabbitMQPassword secret4rabbitmq
  # -- __MUST BE CONFIGURED:__ RabbitMQ broker URL for APROC tasks
  celeryBrokerUrl: &arlasAppCeleryBrokerUrl pyamqp://admin:secret4rabbitmq@arlas-rabbitmq:5672//

  # -- __MUST BE CONFIGURED:__ redis Password
  redisPassword: &arlasAppRedisPassword secret4redis

  # Example of a redis connection url without sentinel:
  # -- __MUST BE CONFIGURED:__ Redis backend URL for APROC task results
  celeryResultBackend: &arlasAppCeleryResultBackend redis://:secret4redis@arlas-stack-redis-master:6379/0
  # Alternative: example of a redis connection url with 3 sentinels and transport options for contacting the redis master:
  # celery_result_backend: &arlasAppCeleryResultBackend sentinel://:mypassword@sentinel1:26379;sentinel://:mypassword@sentinel2:26379;sentinel://:mypassword@sentinel3:26379
  
  postgresql:
    auth:
      # -- __MUST BE CONFIGURED:__ postgres password for keycloak
      password: &arlasAppPostgresPassword secret4postgres

deployment: 
  arlas:
    uis:
      enabled: true
      ingress:
        enabled: true
        annotations:
          # -- Annotation for ARLAS UI ingress
          nginx.ingress.kubernetes.io/use-regex: "true"
          # -- Annotation for ARLAS UI ingress
          nginx.ingress.kubernetes.io/rewrite-target: "/$1"
          # -- Annotation for ARLAS UI ingress
          nginx.ingress.kubernetes.io/proxy-buffering: "off"  # Disable buffering
          # -- Annotation for ARLAS UI ingress
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    services:
      # -- Should the chart deploy arlas-services
      enabled: true
      ingress:
        # -- Should the chart deploy arlas-services ingress
        enabled: true
        # -- Annotations for arlas-services ingress
        annotations:

  aias:
    # -- Should the chart deploy aias-services
    enabled: true
    uis:
      ingress:
        # -- Should the chart deploy aias-uis ingress
        enabled: true
        annotations:
          #-- Annotation for AIAS UI ingress
          nginx.ingress.kubernetes.io/use-regex: "true"
          #-- Annotation for AIAS UI ingress
          nginx.ingress.kubernetes.io/rewrite-target: "/$1"

    services:
      airs:
        ingress:
          # -- Should the chart deploy airs ingress
          enabled: true
          annotations:
            # -- Annotations for AIRS ingress
            nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/url-role-based-authorization"
            # -- Annotations for AIRS ingress
            nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"
            # -- Annotations for AIRS ingress
            nginx.ingress.kubernetes.io/proxy-buffering: "off"

      aproc:
        ingress:
          # -- Should the chart deploy aproc ingress
          enabled: true
          annotations:
            # -- Annotations for APROC ingress
            nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/url-role-based-authorization"
            # -- Annotations for APROC ingress
            nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"
      fam:
        ingress:
          # -- Should the chart deploy fam ingress
          enabled: true
          annotations:
            # -- Annotations for FAM ingress
            nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/url-role-based-authorization"
            # -- Annotations for FAM ingress
            nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"
      minio:
        # -- Minio service configuration for AIAS
        serviceName: arlas-stack-minio
        # -- Minio service port for AIAS
        port: 9000
        ingress:
          # -- Should the chart deploy minio ingress
          enabled: true
          annotations:
            # -- Annotations for Minio ingress
            nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/authorization/airs-storage"
            # -- Annotations for Minio ingress
            nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"
      titiler:
        # -- Titiler service configuration for AIAS
        serviceName: arlas-stack-titiler
        # -- Titiler service port for AIAS
        port: 8000
        ingress:
          # -- Should the chart deploy titiler ingress
          enabled: true
          private:
            annotations:
              # -- Annotations for Titiler ingress
              nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/authorization/cog"
              # -- Annotations for Titiler ingress
              nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"
          public:
            annotations:
              # -- Annotations for Titiler ingress
              nginx.ingress.kubernetes.io/auth-url: "http://arlas-agate.arlas.svc.cluster.local:8000/agate/authorization/titiler_public"
              # -- Annotations for Titiler ingress
              nginx.ingress.kubernetes.io/auth-response-headers: "Authorization, arlas-org-filter"

  elasticsearch:
    # -- Should the chart deploy elasticsearch
    enabled: true
    ingress:
      # -- Should the chart deploy elasticsearch ingress
      enabled: true
  minio:
    # -- Should the chart deploy minio
    enabled: true
    ingress:
      # -- Should the chart deploy minio ingress
      enabled: true
  rabbitmq:
    # -- Should the chart deploy rabbitmq
    enabled: true
  redis:
    # -- Should the chart deploy redis
    enabled: true
  keycloak: 
    # -- __MUST BE CONFIGURED:__ Should the chart deploy keycloak. __Enable for tests only__ or configure carefully the chart for your production needs.
    enabled: true
  titiler:
    # -- Should the chart deploy titiler
    enabled: true


arlas-services:
  # -- Do not change: value defined in global section
  dnsDomain: *arlasAppDnsDomain
  # -- Do not change: value defined in global section
  protocol: *arlasAppProtocol
  # -- Do not change: value defined in global section
  defaultStorageClass: *arlasAppDefaultStorageClass
  elastic:
    # -- Do not change: value defined in global section
    login: *arlasAppElasticLogin
    # -- Do not change: value defined in global section
    password: *arlasAppElasticPassword
    # -- Elasticsearch endpoint for arlas-services
    nodes: arlas-elasticsearch-es-http:9200
  logger:
    # -- Logging level
    loggingLevel: INFO
    # -- Console logging level
    loggingConsoleLevel: INFO
  # @ignored  
  keycloak:
    # -- Do not change: value defined in global section
    secret: *arlasAppKeycloakSecret
    # -- Do not change: value defined in global section
    url: *arlasAppKeycloakUrl
  services:
    # -- __MUST BE CONFIGURED:__ Set to true if you want the services to use the certificate contained in the k8s/charts/arlas-stack/templates/keycloak-certificate-configmap.yaml file and enable the keycloak.ingress.extraTls bloc. False otherwise and disable the keycloak.ingress.extraTls bloc.
    mountCertificate: true
    server:
      # -- __MUST BE CONFIGURED:__ Set server.trustStoreOptions to nothing if mountCertificate is flase, comment otherwise
      #  trustStoreOptions:

      resources:
        requests:   # autoscaling is based on requests.cpu and requests.memory, so we set it close to the limits to avoid scaling up too early
          cpu: 0.8
          memory: 1000Mi 
        limits:
          cpu: 1
          memory: 1000Mi
      autoscaling:
        # -- Enable if you want arlas server to autoscale on CPU and memory
        enabled: False
        # -- Minimum replicas for autoscaling 
        minReplicas: 1
        # -- Maximum replicas for autoscaling
        maxReplicas: 4
        # -- Target CPU utilization percentage for autoscaling
        targetCPUUtilizationPercentage: 70
        # -- Target Memory utilization percentage for autoscaling
        targetMemoryUtilizationPercentage: 70
        # -- Custom metrics for autoscaling, keep nothing for default metrics
        customMetrics:
        # -- Custom behavior for autoscaling, keep nothing for default behavior
        behavior: 

arlas-uis:
  # -- Do not change: value defined in global section
  dnsDomain: *arlasAppDnsDomain
  # -- Do not change: value defined in global section
  protocol: *arlasAppProtocol
  # -- Do not change: value defined in global section
  defaultStorageClass: *arlasAppDefaultStorageClass
  authent:
    # -- Do not change: value defined in global section
    issuer: *arlasAppAuthIssuer
    # -- Do not change: value defined in global section
    logoutUrl: *arlasAppLogoutUrl
  logger:
    # -- Logging level
    loggingLevel: INFO
    # -- Console logging level
    loggingConsoleLevel: INFO
  # -- __MUST BE CONFIGURED:__ Set to 120 Gi if you copy the full basemap
  basemap:
    storageSize: 50Mi
  uis:
    colors:
      arlas:
        # -- Primary color for ARLAS UI
        bg: "#265b87"
      handle:
        # -- Primary color for ARLAS handle
        color: "#384875"
    drawTheme:
      active:
        color: "#fbb03b"
        opacity: "0.8"
        dash: [1,2]
      inactive:
        color: "#3bb2d0"
        opacity: "0.1"
        dash: [1]

    wui:
      # -- Configuration for the ARLAS Web User Interface (WUI) translation with a custom configmap. If you want to add custom translations, create a configmap with the same structure as the one in k8s/charts/arlas-stack/templates/arlas_i18n_custom_configmap.yaml file and set the name of this configmap here. If you don't want to add custom translations, set this value to null or empty string and do not create the configmap. Keys can be found in the ARLAS WUI codebase, in the i18n folder: https://github.com/gisaia/ARLAS-wui/tree/develop/src/assets/i18n.
      customi18nConfigMap: arlas-wui-custom-i18n
      # -- Extra environment variables for the basemap url to download at init container startup (no download if already present). If none specified, a small basemap is used. See for instance https://build.protomaps.com/20231225.pmtiles for a full basemap or https://storage.googleapis.com/gisaia-public/protomaps/world-20231225-0-9.pmtiles for zoom 0 to 9.
      basemapUrl: 

aias-services:
  # -- __Do not change:__ value defined in global section
  dnsDomain: *arlasAppDnsDomain
  # -- __Do not change:__ value defined in global section
  protocol: *arlasAppProtocol
  # -- Init the AIAS minio buckets  
  initBuckets: true
  services:
    airs:
      # -- AIRS service configuration for AIAS
      serviceName: airs-server
      configuration:
        # -- __MUST BE CONFIGURED:__ Prefix for elasticsearch indices created for AIRS collections. This MUST contain the organization name followed by '@' followed by a custom suffix, e.g. org.com@airs
        indexCollectionPrefix: org.com@airs
        s3:
          # -- __Do not change:__ value defined in global section
          accessKeyId: *arlasAppMinioLogin
          # -- __Do not change:__ value defined in global section
          secretAccessKey: *arlasAppMinioPassword
          # -- Minio endpoint
          endpoint: http://arlas-stack-minio:9000
          # -- __IMPORTANT:__ If you change the bucket name here, make sure to overwrite the patterns in agate.configuration.services (k8s/charts/aias-services/values.yaml).
          bucket: airs-storage
          # -- Paths that can be written by AIRS to store assets
          writablePaths:
            - /
          # -- __MUST BE CONFIGURED:__ Change with the domain of your deployment
          assetHttpEndpointUrl: https://site.arlas.k8s/{}/{}

    agate:
      # -- Agate service configuration for AIAS
      serviceName: arlas-agate
      configuration:
        # -- ARLAS search URL used by Agate to check whether an item exists
        arlasUrlSearch: http://arlas-server:8000/arlas/explore/{collection}/_search?f=id:eq:{item}
        # -- Headers used by the ingress controller to pass the original request information to Agate
        urlHeader: x-auth-request-redirect
        # -- Headers used by the ingress controller to pass the original method information to Agate
        methodHeader: x-original-method
        urbac:
          # -- Name of the token audience
          jwtAudience: arlas-backend
          # -- __MUST BE CONFIGURED:__ Change to true in production or if certificate can be verified
          verifySsl: false
          # -- __MUST BE CONFIGURED:__ Change to the URI of the JWKS endpoint of your deployment.
          jwks_uri: https://keycloak.arlas.k8s/realms/arlas/protocol/openid-connect/certs
        # -- If a prefix is added to the arlas deployment, then you must add it to the path permissions below (change "myprefix" with your own prefix and uncomment).
        #roles: 
          # role/arlas/downloader:
          #   permissions:
          #   - r:/myprefix/aproc/processes/download:GET
          #   - r:/myprefix/aproc/processes/download/execution:POST
          #   - r:/myprefix/aproc/jobs/.*:GET,DELETE

          # role/arlas/datasets:
          #   description:
          #   - "Managing data (ingest, update and enrich) in ARLAS"
          #   permissions:
          #   - r:/myprefix/aproc/processes/ingest:GET
          #   - r:/myprefix/aproc/processes/ingest/execution:POST
          #   - r:/myprefix/aproc/processes/enrich:GET
          #   - r:/myprefix/aproc/processes/enrich/execution:POST
          #   - r:/myprefix/aproc/processes/directory_ingest:GET
          #   - r:/myprefix/aproc/processes/directory_ingest/execution:POST
          #   - r:/myprefix/aproc/processes/dc3build:GET
          #   - r:/myprefix/aproc/processes/dc3build/execution:POST
          #   - r:/myprefix/fam/.*:GET,POST
          #   - r:/myprefix/aproc/jobs/.*:GET,DELETE
          #   - r:/myprefix/aproc/jobs:GET
          #   - r:/myprefix/airs/collections/.*:GET,POST,PUT,DELETE

    fam:
      # -- FAM service name
      serviceName: arlas-fam

    aproc:
      service:
        # -- APROC service name
        serviceName: aproc-service
      # -- APROC worker configuration
      worker:
        replicaCount: 1
        resources:
          limits:
            cpu: 2
            memory: 10Gi
        nodeSelector: {}
        tolerations: []
        affinity: {}
      configuration:
        # -- __MUST BE CONFIGURED:__ RabbitMQ broker URL for APROC tasks
        celeryBrokerUrl: *arlasAppCeleryBrokerUrl
        # -- __MUST BE CONFIGURED:__ Redis backend URL for APROC task results
        celeryResultBackend: *arlasAppCeleryResultBackend
        celeryResultBackendTransportOptions:
        #   master_name: mymaster
        #     sentinel_kwargs:
        #       password: mypassword

        # -- AIRS service endpoint URL accessed by APROC
        airsEndpoint: http://airs-server:8000/airs
        # -- ARLAS search URL used by APROC to check whether an item exists
        arlasUrlSearch: http://arlas-server:8000/arlas/explore/{collection}/_search?f=id:eq:{item}
        extensions:
          download:
            outboxS3:
              # -- Do not change: value defined in global section
              accessKeyId: *arlasAppMinioLogin
              # -- Do not change: value defined in global section
              secretAccessKey: *arlasAppMinioPassword
              # -- Minio endpoint
              endpointUrl: http://arlas-stack-minio:9000
              # -- Bucket where downloads are stored
              bucket: downloads
              # -- __MUST BE CONFIGURED:__ Change with the domain of your deployment
              assetHttpEndpointUrl: https://site.arlas.k8s/{}/{}
            index:
              # -- __MUST BE CONFIGURED:__ Change with the domain (org.com) with your own organization name
              name: org.com@aproc_downloads

          ingest:
            # -- Directory where archives to ingest are stored. Must be in sync with the accessManager readable_paths configuration below. Examples: /inputs, https://storage.googleapis.com/gisaia-public/OPENDATA/eo
            #inputsDirectory: http://arlas-stack-minio:9000/inputs
            inputsDirectory: https://storage.googleapis.com/gisaia-public/test-aias
            # -- APROC endpoint URL accessed by ingest processes
            aprocEndpoint: http://aproc-service:8000/aproc
            # -- List of enrichments to be applied to all ingest drivers (e.g. OVERVIEW_COG, COG). If you want to apply different enrichments for each driver, you can configure them in the driver configuration below. If you don't want to apply any enrichment, set this value to an empty list.
            enrichments: []

        accessManager:
          # -- Temporary directory used by the access manager
          tmpDir: /tmp/
          # -- Configuration of the storages used by the access manager to provide access to various storage backends. See https://docs.arlas.io/external_docs/aias/aproc/configuration/#storage-access-configuration
          storages:
            -
              type: file
              writable_paths:
                - /tmp
                - /outbox
              readable_paths:
                - /inputs
            -
              type: gs
              bucket: gisaia-public
              readable_paths:
                - /
              # api_key:
              #   project_id: 
              #   private_key_id: 
              #   private_key: 
            -
              type: s3
              bucket: archives
              endpoint: $APROC_ARCHIVE_ENDPOINT|http://arlas-stack-minio:9000"
              api_key:
                access_key: *arlasAppMinioLogin
                secret_key: *arlasAppMinioPassword
              readable_paths:
                - /inputs
            # -
            #   type: https
            #   headers: 
            #   domain: 
            #   force_download: 
            -
              type: s3
              bucket: gisaia-public
              endpoint: "https://storage.googleapis.com"
              readable_paths:
                - /      
            -
              type: s3
              bucket: downloads
              endpoint: "http://arlas-stack-minio:9000"
              api_key:
                access_key: *arlasAppMinioLogin
                secret_key: *arlasAppMinioPassword
              readable_paths:
                - "/"
              writable_paths:
                - "/"
            -
              type: s3
              bucket: inputs
              endpoint: "http://arlas-stack-minio:9000"
              api_key:
                access_key: *arlasAppMinioLogin
                secret_key: *arlasAppMinioPassword
              readable_paths:
                - "/"

  elastic:
    # -- Do not change: value defined in global section
    login: *arlasAppElasticLogin
    # -- Do not change: value defined in global section
    password: *arlasAppElasticPassword
    # -- Elasticsearch endpoint for aias-services
    endpoint: https://arlas-elasticsearch-es-http:9200

  logger:
    # -- Logging level for aias-services
    loggingLevel: DEBUG
    # -- Console logging level for aias-services
    loggingConsoleLevel: DEBUG

# TITILER
titiler:
  image:
    tag: 2.2.1
  replicaCount: 1
  resources:
    requests:
      cpu: 0.1
      memory: 1Gi
    limits:
      cpu: 4
      memory: 4Gi
  podSecurityContext:
    fsGroup: 1001
    runAsNonRoot: true
    runAsUser: 1001
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001

elasticsearch:
  # -- Name of the Elasticsearch cluster (used as the ECK Elasticsearch custom resource name, and as a prefix for all generated resources: Service, Secrets, StatefulSets)
  clusterName: arlas-elasticsearch
  image:
    # -- Elasticsearch container image repository (official Elastic image, required by the ECK operator)
    repository: docker.elastic.co/elasticsearch/elasticsearch
    # -- Elasticsearch version / image tag. Must match a version supported by the installed ECK operator
    tag: "9.5.0"
  user:
    # -- Login of the custom Elasticsearch superuser account, created via the ECK file realm and used by ARLAS server instead of the built-in `elastic` user
    login: *arlasAppElasticLogin
    # -- Password of the custom Elasticsearch superuser account
    password: *arlasAppElasticPassword
  # -- List of Elasticsearch nodeSets. Each entry maps to one nodeSet in the ECK Elasticsearch CR, allowing independent scaling, roles, and resources per node group (e.g. dedicated master/data/ingest tiers)
  nodeSets:
    - # -- Name of this nodeSet (used as a suffix for the generated StatefulSet; must remain stable, renaming it recreates the underlying StatefulSet and PVCs)
      name: default
      # -- Number of Elasticsearch pods (replicas) in this nodeSet
      count: 1
      # -- Elasticsearch node roles assigned to this nodeSet (e.g. master, data, ingest, data_hot, data_content...)
      roles: ["master", "data", "ingest"]
      # -- Disable memory-mapped storage (node.store.allow_mmap). Set to false when the host does not allow raising vm.max_map_count
      allowMmap: false
      # -- Size of the persistent volume claim requested for Elasticsearch data storage
      storageSize: 3Gi
      resources:
        requests:
          # -- CPU request for the Elasticsearch container
          cpu: "2"
          # -- Memory request for the Elasticsearch container
          memory: 4Gi
        limits:
          # -- CPU limit for the Elasticsearch container
          cpu: "4"
          # -- Memory limit for the Elasticsearch container
          memory: 4Gi
  service:
    # -- Kubernetes Service type used to expose the Elasticsearch HTTP endpoint internally
    type: ClusterIP
  tls:
    # -- Whether to disable the self-signed certificate auto-generated by ECK for the HTTP layer. Keep false to retain TLS encryption by default
    selfSignedDisabled: false
  ingress:
    # -- Public hostname used to expose Elasticsearch through the Ingress controller
    hostname: *arlasAppElasticDnsDomain
    # -- IngressClass used to route traffic to the Elasticsearch Ingress
    ingressClassName: *arlasAppIngressClassName
    # -- Additional annotations applied to the Elasticsearch Ingress (e.g. nginx-ingress TLS passthrough, body size limits, monitoring probes)
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 100240m
      nginx.ingress.kubernetes.io/ssl-passthrough: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      blackbox.monitoring/enabled: "true"

kibana:
  # -- Number of Kibana pod replicas (maps to spec.count in the ECK Kibana custom resource)
  instances: 1
  image:
    # -- Kibana container image repository (official Elastic image, required by the ECK operator)
    repository: docker.elastic.co/kibana/kibana
    # -- Kibana version / image tag. Should match the Elasticsearch version to avoid compatibility issues
    tag: 9.5.0
  ingress:
    # -- Enable the Kibana Ingress resource
    enabled: *arlasAppEnableKibana
    # -- Public hostname used to expose Kibana through the Ingress controller
    hostname: *arlasAppKibanaDnsDomain
    # -- IngressClass used to route traffic to the Kibana Ingress
    ingressClassName: *arlasAppIngressClassName
    # -- Additional annotations applied to the Kibana Ingress
    annotations:
      kubernetes.io/ingress.class: *arlasAppIngressClassName
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"

rabbitmq:
  image:
    # -- Rabbitmq for development and test only. For production, please refer to the rabbitmq documentation to deploy a production ready rabbitmq instance instead.
    repository: docker.io/library/rabbitmq
    # -- Image tag for the RabbitMQ container.
    tag: 4.3.6
  resources:
    limits:
      # -- Memory limit allocated to the RabbitMQ container.
      memory: 2Gi
    requests:
      # -- Memory request allocated to the RabbitMQ container.
      memory: 1Gi
  auth:
    # -- Username for the default RabbitMQ user. Used to pre-create the default-user secret consumed by the operator.
    username: *arlasAppRabbitMQLogin
    # -- Password for the default RabbitMQ user. Used to pre-create the default-user secret consumed by the operator.
    password: *arlasAppRabbitMQPassword
  persistence:
    # -- Storage class used for the RabbitMQ persistent volume claim.
    storageClass: *arlasAppDefaultStorageClass
    # -- Size of the persistent volume claim used to store RabbitMQ data.
    storage: 2Gi
  persistentVolumeClaimRetentionPolicy:
    # -- Enable a custom PVC retention policy on the RabbitMQ StatefulSet.
    enabled: true
    # -- Policy applied to the PVC when the RabbitmqCluster (or its StatefulSet) is deleted. Allowed values: Retain | Delete.
    whenDeleted: Retain
    # -- Policy applied to the PVC when the StatefulSet is scaled down (replica count reduced). Allowed values: Retain | Delete.
    whenScaled: Retain

redis:
