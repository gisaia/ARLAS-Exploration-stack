apiVersion: v2
name: arlas-aias
description: A Helm Chart to deploy the ARLAS Exploration Stack with AIAS services
version: 28.6.0
appVersion: 28.6.0
dependencies:
  # ARLAS BACKEND DEPENDENCIES
  - name: arlas-services
    version: 28.6.0
    repository: "file://../arlas-services"
    condition: deployment.arlas.services.enabled
  - name: aias-services
    version: 28.6.0
    repository: "file://../aias-services"
    condition: deployment.aias.enabled
  # ARLAS FRONTEND DEPENDENCIES
  - name: arlas-uis
    version: 28.6.0
    repository: "file://../arlas-uis"
    condition: deployment.arlas.uis.enabled
  # THIRD PARTY LOCAL DEPENDENCIES
  - name: titiler
    repository: "file://../titiler"
    version: 28.6.0
    condition: deployment.titiler.enabled
  # THIRD PARTY REMOTE DEPENDENCIES
  - name: elasticsearch
    alias: elasticsearch-logs
    repository: https://charts.bitnami.com/bitnami
    version: 22.0.4
    condition: deployment.elasticsearch.logs.enabled
  - name: elasticsearch
    alias: elasticsearch-app
    repository: https://charts.bitnami.com/bitnami
    version: 22.0.4
    condition: deployment.elasticsearch.app.enabled
  - name: minio
    repository: https://charts.bitnami.com/bitnami
    version: 14.10.5
    condition: deployment.minio.enabled
  - name: rabbitmq
    repository: https://charts.bitnami.com/bitnami
    version: 16.0.11
    condition: deployment.rabbitmq.enabled
  - name: redis
    repository: https://charts.bitnami.com/bitnami
    version: 21.2.13
    condition: deployment.redis.enabled
  - name: keycloak
    repository: https://charts.bitnami.com/bitnami
    version: 25.2.0
    condition: deployment.keycloak.enabled
  - name: apm-server
    repository: "https://helm.elastic.co"
    version: 8.5.1
    condition: deployment.apmServer.enabled