{{- if and .Values.deployment.keycloak.enabled .Values.keycloak.db.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db
type: Opaque
stringData:
  username: {{ .Values.keycloak.db.postgresql.username | quote }}
  password: {{ .Values.keycloak.db.postgresql.password  | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloak.db.postgresql.service.serviceName }}
  labels:
    app.kubernetes.io/component: {{ .Values.keycloak.db.postgresql.service.serviceName }}
spec:
  selector:
    app.kubernetes.io/component: {{ .Values.keycloak.db.postgresql.service.serviceName }}
  type: {{ .Values.keycloak.db.postgresql.service.type }}
  ports:
  - name: postgres
    port: {{ .Values.keycloak.db.postgresql.service.port }}
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.keycloak.db.postgresql.service.serviceName }}
spec:
  serviceName: {{ .Values.keycloak.db.postgresql.service.serviceName }}
  replicas: {{ .Values.keycloak.db.postgresql.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.keycloak.db.postgresql.service.serviceName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: {{ .Values.keycloak.db.postgresql.service.serviceName }}
    spec:
      {{- with .Values.keycloak.db.postgresql.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.db.postgresql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.db.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.db.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.db.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.db.postgresql.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.keycloak.db.postgresql.image.repository }}:{{ .Values.keycloak.db.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.db.postgresql.image.pullPolicy }}
          {{- with .Values.keycloak.db.postgresql.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.keycloak.db.postgresql.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: username}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-db, key: password}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- with .Values.keycloak.db.postgresql.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          resources:
            requests:
              cpu: {{ .Values.keycloak.db.postgresql.resources.requests.cpu | quote }}
              memory: {{ .Values.keycloak.db.postgresql.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.keycloak.db.postgresql.resources.limits.cpu | quote }}
              memory: {{ .Values.keycloak.db.postgresql.resources.limits.memory | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- with .Values.keycloak.db.postgresql.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.keycloak.db.postgresql.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (not .Values.keycloak.db.postgresql.persistence.enabled) .Values.keycloak.db.postgresql.extraVolumes }}
      volumes:
        {{- if not .Values.keycloak.db.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.keycloak.db.postgresql.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if .Values.keycloak.db.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.keycloak.db.postgresql.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.keycloak.db.postgresql.persistence.accessModes | nindent 10 }}
        {{- with .Values.keycloak.db.postgresql.persistence.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . | quote }}{{ end }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.keycloak.db.postgresql.persistence.size }}
  {{- end }}
{{- end }}
