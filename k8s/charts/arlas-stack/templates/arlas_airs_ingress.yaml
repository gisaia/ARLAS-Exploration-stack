{{- if and .Values.deployment.aias.services.airs.ingress.enabled (get .Values "aias-services").services.airs.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arlas-airs-ingress
  annotations:
    {{ .Values.deployment.aias.services.airs.ingress.annotations | toYaml | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  {{- if .Values.global.ingressTlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.global.dnsDomain }}
      secretName: {{ .Values.global.ingressTlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.global.dnsDomain }}
      http:
        paths:
          - path: /airs/collections
            pathType: Prefix
            backend:
              service:
                name: {{ (get .Values "aias-services").services.airs.serviceName }}
                port:
                  number: {{ (get .Values "aias-services").services.servicePort }}
{{- end }}
