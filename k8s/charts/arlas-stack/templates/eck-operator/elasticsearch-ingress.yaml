{{- range $key, $inst := (include "elastic.instances" . | fromJson) }}
{{- if and $inst.enabled $inst.elasticsearch.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $inst.elasticsearch.ingress.name }}
  annotations: {{- toYaml $inst.elasticsearch.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ $inst.elasticsearch.ingress.ingressClassName }}
  rules:
    - host: {{ $inst.elasticsearch.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $inst.elasticsearch.clusterName }}-es-http
                port:
                  number: 9200
{{- end }}
{{- end }}