{{- if .Values.global.gateway.enabled }}
{{- range $key, $inst := (include "elastic.instances" . | fromJson) }}
{{- if and $inst.enabled $inst.elasticsearch.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $inst.elasticsearch.clusterName }}-http-to-https-redirect
spec:
  parentRefs:
    - name: {{ $.Values.global.gateway.name }}
      sectionName: http
  hostnames:
    - {{ $inst.elasticsearch.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
{{- end }}