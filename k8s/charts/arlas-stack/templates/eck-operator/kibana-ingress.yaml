{{- if and .Values.global.enableKibana .Values.kibana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arlas-kibana-ingress
  annotations:
    {{ .Values.kibana.ingress.annotations | toYaml | nindent 4 }}
spec:
  ingressClassName: {{ .Values.kibana.ingress.ingressClassName }}
  rules:
    - host: {{ .Values.kibana.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arlas-kibana-http
                port:
                  number: 5601
{{ end }}