
{{- if .Values.global.gateway.enabled }}
{{- range $key, $inst := (include "elastic.instances" . | fromJson) }}
{{- if and $inst.enabled $inst.elasticsearch.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $inst.elasticsearch.clusterName }}-route
spec:
  parentRefs:
    - name: {{ $.Values.global.gateway.name }}
      sectionName: https
  hostnames:
    - {{ $inst.elasticsearch.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $inst.elasticsearch.clusterName }}-es-http
          port: 9200
{{- end }}
{{- end }}
{{- end }}