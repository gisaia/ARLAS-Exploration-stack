{{- if and .Values.deployment.arlas.services.ingress.enabled (get .Values "arlas-services").services.persistence.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arlas-persistence-ingress
  annotations:
    {{ .Values.deployment.arlas.services.ingress.annotations | toYaml | nindent 4 }}
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.global.dnsDomain }}
      secretName: {{ .Values.global.ingressTlsSecretName }}
  rules:
    - host: {{ .Values.global.dnsDomain }}
      http:
        paths:
          - path: /persist/
            pathType: Prefix
            backend:
              service:
                name: {{ (get .Values "arlas-services").services.persistence.serviceName }}
                port:
                  number: {{ (get .Values "arlas-services").services.servicePort }}
{{- end }}
