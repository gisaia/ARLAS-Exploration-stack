{{- if .Values.deployment.minio.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console-ingress
spec:
  ingressClassName: {{ .Values.global.ingressClassName }}
  rules:
    - host: {{ .Values.global.minioDnsDomain }}
      http:
        paths:
          - backend:
              service:
                name: arlas-stack-minio-console
                port:
                  number: 9090
            path: /
            pathType: ImplementationSpecific
 {{- end }}
