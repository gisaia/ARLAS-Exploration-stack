{{- if .Values.deployment.aias.services.fam.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arlas-fam-route
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name }}
      sectionName: https  
  hostnames:
    - {{ .Values.global.dnsDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /fam/
        - path:
            type: Exact
            value: /fam/files/
      backendRefs:
        - name: {{ (get .Values "aias-services").services.fam.serviceName }}
          port: {{ (get .Values "aias-services").services.servicePort }}
{{- end }}