{{- if and .Values.deployment.arlas.services.gateway.enabled .Values.global.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arlas-permissions-route
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name }}
      sectionName: https
  hostnames:
    - {{ .Values.global.dnsDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /permissions/
      backendRefs:
        - name: {{ (get .Values "arlas-services").services.permissions.serviceName }}
          port: {{ (get .Values "arlas-services").services.servicePort }}
{{- end }}