{{- if and .Values.deployment.elasticsearch.gateway.enabled  .Values.global.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: elasticsearch-http-to-https-redirect
spec:
  parentRefs:
    - name: {{ .Values.global.gateway.name }}
      sectionName: http
  hostnames:
    - {{ .Values.global.elasticDnsDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}